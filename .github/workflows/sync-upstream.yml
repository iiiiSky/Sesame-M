name: Sync fork with upstream

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间每天 01:00 自动同步 (UTC 17:00)
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: MIUIX-api102

      - name: Fetch upstream and merge (keep local commits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aw1y2z/Sesame-M.git
          git fetch upstream MIUIX-api102
          if git merge --no-edit upstream/MIUIX-api102 >/tmp/merge.log 2>&1; then
            git push origin MIUIX-api102
            echo "::notice::同步成功，已合并上游最新 MIUIX-api102"
          else
            echo "::error::与上游合并产生冲突，未改动本地仓库，请手动处理"
            echo "----- merge log -----"
            cat /tmp/merge.log
            git merge --abort
            exit 1
          fi
