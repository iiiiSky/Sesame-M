name: Sync fork with upstream

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间每天 01:00 自动同步 (UTC 17:00)
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: MIUIX-api102

      - name: Fetch upstream and merge (keep local commits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aw1y2z/Sesame-M.git
          git fetch upstream MIUIX-api102
          if git merge --no-edit upstream/MIUIX-api102 >/tmp/merge.log 2>&1; then
            git push origin MIUIX-api102
            echo "::notice::同步成功，已合并上游最新 MIUIX-api102"
          else
            echo "::error::与上游合并产生冲突，未改动本地仓库，请手动处理"
            echo "----- merge log -----"
            cat /tmp/merge.log
            git merge --abort
            exit 1
          fi

      - name: Create release following upstream tag
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          UP_REPO="aw1y2z/Sesame-M"
          FORK_REPO="iiiiSky/Sesame-M"
          UP_TAG=$(gh api "repos/$UP_REPO/releases" --jq '[.[] | select(.draft==false)][0].tag_name')
          echo "上游最新 release tag: $UP_TAG"
          echo "up_tag=$UP_TAG" >> "$GITHUB_OUTPUT"
          if gh api "repos/$FORK_REPO/git/refs/tags/$UP_TAG" >/dev/null 2>&1; then
            echo "::notice::fork 已存在 tag $UP_TAG，跳过创建"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            HEAD=$(git rev-parse HEAD)
            gh api "repos/$FORK_REPO/git/refs" \
              -f ref="refs/tags/$UP_TAG" -f sha="$HEAD" >/dev/null
            gh api "repos/$FORK_REPO/releases" \
              -f tag_name="$UP_TAG" -f name="$UP_TAG" \
              -F draft=false -F prerelease=false \
              -f body="> 自动同步上游 $UP_REPO 后发布的 $UP_TAG" >/dev/null
            echo "::notice::已创建 release $UP_TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android CI to build APKs (fork release event workaround)
        if: steps.create_release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FORK_REPO="iiiiSky/Sesame-M"
          UP_TAG="${{ steps.create_release.outputs.up_tag }}"
          echo "为 tag $UP_TAG 触发 Android CI 构建 APK..."
          gh api -X POST "repos/$FORK_REPO/actions/workflows/release.yml/dispatches" \
            --input - <<EOF
        {"ref":"MIUIX-api102","inputs":{"tag":"$UP_TAG"}}
      EOF
          echo "::notice::已触发 Android CI 构建 $UP_TAG"
